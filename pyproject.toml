[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crossborder-catalog-cowork"
version = "0.1.0"
description = "Multi-agent cross-border womenswear catalog governance workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<6",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
agents = ["camel-ai>=0.2.70,<0.3"]
vector = ["lancedb>=0.17,<1"]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
crossborder-cowork = "crossborder_cowork.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crossborder_cowork"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
