name: Verify AgentTeams Web workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/verify.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --color=no --tb=short

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run type-check
      - working-directory: web
        run: npm run build
