name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/test_catalog_listing_integration.py tests/test_production_scenario_acceptance.py -q --color=no --tb=short

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win:prepared
            artifact: windows
          - os: macos-latest
            command: package:mac-arm64:prepared
            artifact: macos-arm64
          - os: macos-15-intel
            command: package:mac-x64:prepared
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/build_backend.py
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run type-check
      - working-directory: desktop
        run: npm run build
      - working-directory: desktop
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_packaged_backend.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: crossborder-catalog-cowork-${{ matrix.artifact }}
          path: desktop/release/**
          if-no-files-found: error
